<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Логи</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <header class="admin-header">
        <nav class="admin-nav">
            <button class="burger-menu" onclick="toggleBurgerMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <img src="/static/images/logo.svg" alt="logo" class="admin-logo">
            <div class="nav-items-wrapper" id="navItems">
                <a href="/admin/users" class="nav-item">Пользователи</a>
                <a href="/admin/add-user" class="nav-item">Добавить пользователя</a>
                <a href="/admin/temp-link" class="nav-item">Разовый пропуск</a>
                <a href="/admin/change-password" class="nav-item">Сменить пароль</a>
                <a href="/admin/logs" class="nav-item active">Логи</a>
                <a href="/admin/settings" class="nav-item">Филиал</a>
                <form method="POST" action="/admin/logout" style="display:contents">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="nav-item logout mobile-logout" title="Выход" style="border:0;cursor:pointer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 17l5-5-5-5" stroke="#272b2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 12H9" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                </form>
            </div>
            <form method="POST" action="/admin/logout" style="display:contents">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="nav-item logout desktop-logout" title="Выход" style="border:0;cursor:pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                    <path d="M16 17l5-5-5-5" stroke="#272b2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12H9" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
                </form>
        </nav>
    </header>
    
    <div class="admin-container">
        <div class="admin-content">
            <h1>Логи действий</h1>
            
            <div class="filter-section" style="display:flex; gap:10px; align-items:center;">
                <select id="logType">
                    <option value="all">Все логи</option>
                    <option value="admin">Действия администраторов</option>
                    <option value="user">Действия пользователей</option>
                    <option value="error">Ошибки</option>
                    <option value="sim800">Ошибки SIM800c</option>
                </select>
                <input type="date" id="dateFrom" placeholder="От даты">
                <input type="date" id="dateTo" placeholder="До даты">
                <div style="margin-left:auto;">
                    {% if is_super %}<button id="downloadLogsZipBtn" class="btn-icon" title="Скачать логи ZIP" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3v12" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
                            <path d="M8 11l4 4 4-4" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 21h16" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>{% endif %}
                </div>
            </div>
            
            <div class="logs-container">
                <div class="log-item" style="display: none;">
                    <div class="log-header">
                        <span class="log-time">2025-11-07 10:30:45</span>
                        <span class="log-type error">ERROR</span>
                    </div>
                    <div class="log-message">
                        Пример лога ошибки SIM800c
                    </div>
                    <div class="log-details">
                        Phone: +79123456789, Error: Connection timeout
                    </div>
                </div>
                
                <div id="logsList">
                    <!-- Логи загружаются через AJAX -->
                </div>
            </div>
            
            <div id="noLogs" style="display: none;">
                <p>Логи не найдены</p>
            </div>
        </div>
    </div>
    
    <script>
        window.BASE_URL = {{ (BASE_URL or "") | tojson }};
    </script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
