{% extends "base.html" %}
{% set admin_page = true %}
{% block title %}Админка - Логи{% endblock %}
{% block content %}
<div class="admin-container">
        <div class="admin-content">
            <div class="page-heading"><div><p class="page-eyebrow">История</p><h1>Журнал событий</h1><p class="page-description">Действия пользователей, изменения и диагностика.</p></div></div>
            
            <div class="filter-section" style="display:flex; gap:10px; align-items:center;">
                <select id="logType">
                    <option value="all">Все логи</option>
                    <option value="admin">Действия администраторов</option>
                    <option value="user">Действия пользователей</option>
                    <option value="error">Ошибки</option>
                    <option value="sim800">Ошибки SIM800c</option>
                </select>
                <input type="date" id="dateFrom" placeholder="От даты">
                <input type="date" id="dateTo" placeholder="До даты">
                <div style="margin-left:auto;">
                    {% if is_super %}<button id="downloadLogsZipBtn" class="btn-icon" title="Скачать логи ZIP" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3v12" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
                            <path d="M8 11l4 4 4-4" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 21h16" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>{% endif %}
                </div>
            </div>
            
            <div class="logs-container"><div id="logsList">
                    <!-- Логи загружаются через AJAX -->
                </div>
            </div>
            
            <div id="noLogs" style="display: none;">
                <p>Логи не найдены</p>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
<script>
        window.BASE_URL = {{ (BASE_URL or "") | tojson }};
    </script>
<script src="/static/js/admin.js"></script>
{% endblock %}
