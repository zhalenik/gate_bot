<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Сменить пароль</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <header class="admin-header">
        <nav class="admin-nav">
            <button class="burger-menu" onclick="toggleBurgerMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <img src="/static/images/logo.svg" alt="logo" class="admin-logo">
            <div class="nav-items-wrapper" id="navItems">
                <a href="/admin/users" class="nav-item">Пользователи</a>
                <a href="/admin/add-user" class="nav-item">Добавить пользователя</a>
                <a href="/admin/temp-link" class="nav-item">Разовый пропуск</a>
                <a href="/admin/change-password" class="nav-item active">Сменить пароль</a>
                <a href="/admin/logs" class="nav-item">Логи</a>
                <a href="/admin/settings" class="nav-item">Филиал</a>
                <form method="POST" action="/admin/logout" style="display:contents">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="nav-item logout mobile-logout" title="Выход" style="border:0;cursor:pointer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 17l5-5-5-5" stroke="#272b2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 12H9" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                </form>
            </div>
            <form method="POST" action="/admin/logout" style="display:contents">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="nav-item logout desktop-logout" title="Выход" style="border:0;cursor:pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                    <path d="M16 17l5-5-5-5" stroke="#272b2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12H9" stroke="#272b2e" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
                </form>
        </nav>
    </header>
    
    <div class="admin-container">
        <div class="admin-content">
            <h1>Смена пароля</h1>
            
            <form id="changePasswordForm" class="admin-form">
                <div class="form-group">
                    <label for="oldPassword">Текущий пароль *</label>
                    <input type="password" id="oldPassword" name="oldPassword" maxlength="1024" autocomplete="current-password" required>
                </div>
                
                <div class="form-group">
                    <label for="newPassword">Новый пароль *</label>
                    <input type="password" id="newPassword" name="newPassword" minlength="12" maxlength="1024" autocomplete="new-password" required>
                    <div id="passwordStrength" class="password-strength"></div>
                    <ul class="password-requirements">
                        <li id="length">От 12 до 1024 символов; можно использовать длинную парольную фразу</li>
                    </ul>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Подтвердите новый пароль *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="12" maxlength="1024" autocomplete="new-password" required>
                    <div id="passwordMatch" class="password-match"></div>
                </div>
                
                <button type="submit" id="submitBtn" class="btn-primary" disabled>Сменить пароль</button>
            </form>
            
            <div id="resultMessage" class="result-message"></div>
        </div>
    </div>
    
    <script>
        window.BASE_URL = {{ (BASE_URL or "") | tojson }};
    </script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
