<div class="icon-frame-editor">
  <div class="icon-frame-preview"><div data-icon-frame><img alt="Предпросмотр иконки приложения"></div></div>
  <div class="icon-frame-controls">
    <label>Кадрирование<select name="icon_fit"><option value="cover">Заполнить квадрат</option><option value="contain">Поместить целиком</option></select></label>
    <label>Поля с каждой стороны, %<input type="number" name="icon_padding" min="0" max="30" step="1" value="0" required></label>
    <label>Фон иконки<input type="color" name="icon_background" value="#ffffff"></label>
    <label class="checkbox-label"><input type="checkbox" name="icon_transparent"> Прозрачный фон</label>
  </div>
</div>
