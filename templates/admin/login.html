<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align:center; margin-bottom: 12px;">
                <img src="/static/images/logo.svg" alt="logo" style="max-width: 180px; width: 60%; height: auto;">
            </div>
            <h1 style="font-size:22px; text-align:center;">Вход в систему</h1>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="/admin/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" autocomplete="username" aria-describedby="username-help" maxlength="200" required>
                    <small id="username-help">Укажите логин учётной записи, а не отображаемое имя.</small>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required>
                </div>
                
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            
            <div class="login-footer">
                <a href="/">← Вернуться на главную</a>
            </div>
        </div>
    </div>
</body>
</html>
