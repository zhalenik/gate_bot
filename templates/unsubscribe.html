{% extends "base.html" %}
{% block title %}Отписка от рассылки{% endblock %}
{% block content %}

    <div class="guest-container">
        <div class="guest-card">
            <span class="guest-symbol" aria-hidden="true">↗</span>
            <h1 class="error-title">Отписка от рассылки</h1>
            <p class="page-description">
                {{ user_name }}, вы отключаете уведомления о пропусках на стоянку. Сам доступ определяется действующим пропуском.
            </p>
            <form method="POST" action="{{ url_for('unsubscribe', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn-primary">Подтвердить отписку</button>
                <a href="/" class="text-link">Отмена</a>
            </form>
        </div>
    </div>

{% endblock %}
