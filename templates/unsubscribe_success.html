{% extends "base.html" %}
{% block title %}Отписка завершена{% endblock %}
{% block content %}

    <div class="guest-container">
        <div class="guest-card">
            <span class="guest-symbol" aria-hidden="true">↗</span>
            <h1 class="error-title">Отписка завершена</h1>
            <p class="page-description">
                {{ user_name }}, уведомления о пропусках на стоянку отключены.
            </p>
            <a href="/" class="text-link">Вернуться на главную</a>
        </div>
    </div>

{% endblock %}
