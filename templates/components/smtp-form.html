  <div id="smtpNotice" role="status" hidden></div>
  <section class="panel"><p id="smtpState" class="page-description"></p>
    <form id="smtpForm" class="admin-form">
      <label class="checkbox-label"><input name="enabled" type="checkbox"> Отправлять email</label>
      <div class="form-group"><label>SMTP-сервер<input name="host" autocomplete="off" maxlength="253" placeholder="smtp.example.com"></label></div>
      <div class="form-group"><label>Защищённое соединение<select name="security" aria-label="Защищённое соединение"><option value="ssl">SSL/TLS · обычно порт 465</option><option value="starttls">STARTTLS · обычно порт 587</option></select></label></div>
      <div class="form-group"><label>Порт<input name="port" type="number" min="1" max="65535" required value="465"></label></div>
      <div class="form-group"><label>Логин<input name="username" autocomplete="off" maxlength="254"></label></div>
      <div class="form-group"><label>Пароль приложения<input name="password" type="password" autocomplete="new-password" maxlength="1024"></label><small id="smtpPasswordHint">Оставьте пустым, чтобы сохранить текущий пароль.</small></div>
      <div class="form-group"><label>Имя отправителя<input name="from_name" maxlength="100" placeholder="GateBot"></label></div>
      <div class="form-group"><label>Email отправителя<input name="from_email" type="email" autocomplete="email" maxlength="254"></label></div>
      <details><summary>Удалить сохранённый пароль</summary><p class="page-description">Сначала отключите отправку или очистите логин.</p><label class="checkbox-label"><input name="clear_password" type="checkbox"> Удалить пароль при сохранении</label></details>
      <div class="action-buttons"><button class="btn-primary" type="submit">Сохранить</button><button class="btn-action" type="button" id="smtpCheck">Проверить соединение</button></div>
    </form>
    <p class="page-description">Используйте пароль приложения почтового провайдера, если он требуется. Проверка соединения не отправляет писем. Изменения применяются сразу.</p>
  </section>
