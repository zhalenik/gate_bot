name: Publish GateBot image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/publish-image.yml"
      - "VERSION"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "*.py"
      - "storage/**"
      - "templates/**"
      - "static/**"
      - "resources/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gatebot-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Git tag does not match VERSION: $GITHUB_REF_NAME != v$VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and publish linux/amd64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the published image on empty temporary volumes
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          container=$(docker run -d --network none --env SECRET_KEY --env GATEBOT_ENV=production \
            --tmpfs /state:uid=568,gid=568,mode=0700 --tmpfs /app/private/system-config:uid=568,gid=568,mode=0700 \
            --health-interval=2s --health-start-period=2s --health-retries=15 "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            state=$(docker inspect --format '{{.State.Status}}/{{.State.Health.Status}}' "$container")
            if [[ "$state" == "running/healthy" ]]; then
              docker exec "$container" python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:5000/admin/login', timeout=5).status == 200"
              exit 0
            fi
            [[ "$state" == "running/starting" ]] || break
            sleep 2
          done
          echo "GateBot startup failed ($state)"
          exit 1
