{% if client_pwa | default(none) %}
<link rel="manifest" href="{{ client_pwa.manifest_url }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ client_pwa.branch_name if client_appearance and client_appearance.settings.hide_logo else 'GateBot' }}">
<link rel="stylesheet" href="/static/css/client-pwa.css">
{% endif %}
